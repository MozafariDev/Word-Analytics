<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Analytics - mozafari.runflsre.run</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <header class="container_head">
        <div class="berger_button"></div>
        <h1 class="header_title">
          word <span class="header_span">Analytics</span>
        </h1>
        <h2 class="second_title">MOZAFARI.RUNFLARE.RUN</h2>
      </header>
      <main class="container_main">
        <textarea
          placeholder="Type anything!......"
          class="container_input"
        ></textarea>
        <div class="main_outputs">
          <div class="output_box words">
            <p class="output word-counter">0</p>
            <p class="output-title">words</p>
          </div>
          <div class="output_box">
            <p class="output alfabet-counter">0</p>
            <p class="output-title">alfabets</p>
          </div>
          <div class="output_box twitter">
            <p class="output twitter-post-lmit">0</p>
            <p class="output-title">twitter lmit</p>
          </div>
          <div class="output_box redit">
            <p class="output redit-post-limit">0</p>
            <p class="output-title">redit lmit</p>
          </div>
        </div>
      </main>
      <footer class="container_footer">
        <p class="copy_write">
          &copy; تمام حقوق مادی و معنوی این سایت مطعلق به طاها مظفری میباشد
        </p>
        <br />
        <p class="developer_name">Taha Mozafari</p>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
