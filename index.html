    />

    <!-- title -->

    <title>Word Analytics - mozafari.vercel.app</title>

    <!-- style link -->

    <link rel="stylesheet" href="style.css" />

    <!-- fonts link -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- container -->
    <div class="container">
      <!-- header -->
      <header class="container_head">
        <div class="berger_button"></div>
        <h1 class="header_title">
          word <span class="header_span">Analytics</span>
        </h1>
        <a href="https://mozafari.vercel.app/"
          ><h2 class="second_title">MOZAFARI.VERCEL.APP</h2></a
        >
      </header>
      <!-- main -->
      <main class="container_main">
        <!-- input -->
        <textarea
          placeholder="Enter your text"
          class="container_input"
        ></textarea>
        <!-- out puts -->
        <div class="main_outputs">
          <div class="output_box words">
            <p class="output word-counter">0</p>
            <p class="output-title">words</p>
          </div>
          <div class="output_box">
            <p class="output alfabet-counter">0</p>
            <p class="output-title">characters</p>
          </div>
          <div class="output_box twitter">
            <p class="output twitter-post-lmit">200</p>
            <p class="output-title">twitter</p>
          </div>
          <div class="output_box redit">
            <p class="output redit-post-limit">350</p>
            <p class="output-title">redit</p>
          </div>
        </div>
      </main>
      <!-- footer -->
      <footer class="container_footer">
        <p class="developer_name">Taha Mozafari</p>
        <br />
        <!-- links -->
        <div class="footer-links">
          <p>
            <!-- website link -->
            <a
              target="_blank"
              style="font-size: 12px"
              href="https://mozafari.vercel.app"
              >My website</a
            >
            <p> and</p>
           <!-- Github link -->
            <a
              target="_blank"
              style="font-size: 12px"
              href="https://github.com/mozafaridev"
              >My Github</a
            >
          </p>
        </div>
      </footer>
    </div>
    <!-- script link -->
    <script src="script.js"></script>
  </body>
</html>
